name: zoo_treasure_hunt_flutter
description: "A zoo animal sighting tracker - Flutter port of ZooTreasureHunt."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management (replaces Hilt + StateFlow)
  provider: ^6.1.2

  # Persistence (replaces DataStore)
  shared_preferences: ^2.3.2

  # Sensors (replaces your sensor managers)
  image_picker: ^1.1.2        # Camera
  sensors_plus: ^6.1.0        # Accelerometer + light
  pedometer: ^4.0.2           # Step counter

  # Navigation (replaces Routes.kt)
  go_router: ^14.6.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true